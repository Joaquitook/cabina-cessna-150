<!doctype html>
<!-- styleguide.html — guía de estilo viva del sistema de diseño v2 (contrato UI/UX v4 §3).
     Muestra TODOS los componentes de src/kit.js con los estilos reales de src/styles.css.
     Abrila con un servidor estático desde la raíz del proyecto (python -m http.server 8781) → /tests/styleguide.html
     Cambiá el tema con el selector de arriba (Automático / Claro / Oscuro). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de estilo · Cabina Cessna 150</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../src/styles.css">
<style>
  html, body { height: auto; }
  body { overflow: auto; font-size: 17px; line-height: 1.55; }
  .sg-root { max-width: 1040px; margin: 0 auto; padding: 24px 20px 96px; }
  .sg-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--fg); margin-bottom: 8px; }
  .sg-demo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius-m); background: var(--bg); }
  .sg-demo + .sg-demo { margin-top: 12px; }
  .sg-label { font-family: var(--font-data); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-soft); margin: 18px 0 6px; }
  .sg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .sg-icn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); font-family: var(--font-data); font-size: 11.5px; color: var(--fg-soft); text-align: center; }
  .sg-icn .icon { width: 28px; height: 28px; color: var(--fg); }
  .sg-sw { display: flex; flex-direction: column; justify-content: flex-end; min-height: 74px; padding: 8px 10px; border-radius: var(--radius-s); font-family: var(--font-data); font-size: 12px; border: 1px solid var(--line); }
  .sg-wide { flex: 1 1 100%; }
  .sg-stage { width: 100%; padding: 22px; border-radius: var(--radius-m); background: #0E151B; color: var(--ov-fg); }
  .sg-stage .glass { display: inline-flex; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--ov-bg); border: 1px solid var(--ov-line); backdrop-filter: blur(8px); font-family: var(--font-data); font-size: 14px; }
  /* v5: escenario de ejemplo para el HUD, el dock y la cadena (el mismo CSS que usa la app sobre el 3D) */
  .sg-3d { position: relative; width: 100%; height: 440px; border-radius: var(--radius-m); overflow: hidden; container-type: inline-size; container-name: vp; --inset-w: 200px;
    background: radial-gradient(ellipse at 50% 35%, #2A3A4A 0%, #121B24 60%, #0B1117 100%); }
  .sg-3d--phone { max-width: 390px; height: 520px; --inset-w: 130px; }
  .sg-3d .sg-inset { position: absolute; z-index: 2; right: 12px; top: 12px; width: 200px; height: 140px; background: linear-gradient(160deg, #4B7BA8, #2A4560); box-shadow: inset 0 0 0 1px rgba(255,255,255,.24); }
  .sg-3d--phone .sg-inset { right: 8px; top: 8px; width: 130px; height: 96px; }
  .sg-3d .sg-inset .inset-label { position: absolute; left: 6px; top: 6px; }
  .sg-paper { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-m); max-width: 440px; width: 100%; }
  .sg-pair { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; width: 100%; }
  .sg-callout-mock { position: absolute; z-index: 3; }
</style>
</head>
<body>
<div class="sg-root" id="sg"></div>

<script src="../src/icons.js"></script>
<script src="../src/kit.js"></script>
<script>
(function () {
  var K = C150.Kit, h = K.el, root = document.getElementById('sg');
  var n = 0;
  function sec(title, meta) { n++; root.appendChild(K.sectionHeader(n, title, meta)); }
  function demo() { var d = h('div', { 'class': 'sg-demo' }); for (var i = 0; i < arguments.length; i++) K.add(d, arguments[i]); root.appendChild(d); return d; }
  function label(t) { root.appendChild(h('p', { 'class': 'sg-label', text: t })); }

  /* ---- top: title + theme */
  var theme = K.segmented({
    label: 'Tema', auto: true, value: 'auto',
    items: [{ value: 'auto', label: 'Automático', icon: 'auto' }, { value: 'light', label: 'Claro', icon: 'sun' }, { value: 'dark', label: 'Oscuro', icon: 'moon' }],
    onChange: function (v) { var de = document.documentElement; if (v === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', v); }
  });
  root.appendChild(h('header', { 'class': 'sg-top' },
    h('div', null, h('p', { 'class': 'mode-kicker' }, h('span', { 'class': 'mode-kicker-dot' }), 'Sistema de diseño v2'),
      h('h1', { 'class': 'display', text: 'Guía de estilo' }),
      h('p', { 'class': 'mode-sub', text: 'Todos los componentes de C150.Kit con los estilos reales de la app. Probalos en claro y en oscuro.' })),
    theme));

  /* ---- 01 colores */
  sec('Colores y tokens', 'claro · oscuro');
  var sw = h('div', { 'class': 'sg-grid' });
  [['--bg', 'fondo'], ['--surface', 'superficie'], ['--surface-2', 'superficie 2'], ['--line', 'línea'], ['--fg', 'texto'], ['--fg-soft', 'texto suave'],
   ['--accent', 'acento'], ['--accent-ink', 'acento (texto)'], ['--ok', 'ok'], ['--warn', 'aviso'], ['--bad', 'error'], ['--info', 'info']].forEach(function (t) {
    var dark = ['--fg', '--accent-ink', '--bad', '--info', '--ok', '--fg-soft'].indexOf(t[0]) >= 0;
    sw.appendChild(h('div', { 'class': 'sg-sw', style: { background: 'var(' + t[0] + ')', color: dark ? '#fff' : 'var(--fg)' } }, h('strong', { text: t[1] }), t[0]));
  });
  root.appendChild(sw);

  /* ---- 02 tipografía */
  sec('Tipografía', 'Barlow Condensed · Atkinson · B612 Mono');
  demo(h('div', { 'class': 'sg-wide' },
    h('p', { 'class': 'display', text: 'Display 40 — Cabina Cessna 150' }),
    h('p', { 'class': 'h1', text: 'H1 30 — Tu camino para aprender a volar' }),
    h('p', { 'class': 'h2', text: 'H2 22 — Conocé la cabina' }),
    h('p', { 'class': 'h3', text: 'H3 18 — El acelerador' }),
    h('p', { 'class': 'measure', text: 'Cuerpo 17/1.55 (Atkinson Hyperlegible). Tirás el volante hacia vos y la nariz del avión sube; lo empujás y baja. Es el mando más importante de la cabina, y por eso conviene aprenderlo primero. Largo de línea máximo: 62 caracteres.' }),
    h('p', { 'class': 'small soft', text: 'Chico 14,5 — para aclaraciones y datos secundarios.' }),
    h('p', { 'class': 'data', text: 'DATO 15 · 2 450 RPM · 85 kt · 29,92 inHg' })));

  /* ---- 03 botones */
  sec('Botones');
  demo(K.button({ label: 'Primario', variant: 'primary', icon: 'play' }), K.button({ label: 'Secundario', variant: 'secondary' }), K.button({ label: 'Normal' }),
    K.button({ label: 'Fantasma', variant: 'ghost' }), K.button({ label: 'Cargando', variant: 'primary', loading: true }), K.button({ label: 'Desactivado', disabled: true }),
    K.button({ label: 'Siguiente', variant: 'primary', iconRight: 'chevron-right' }));
  demo(K.button({ label: 'Grande', variant: 'primary', size: 'large', icon: 'plane' }), K.button({ label: 'Chico', size: 'small' }), K.button({ label: 'Chico', variant: 'secondary', size: 'small' }),
    K.iconButton({ icon: 'search', label: 'Buscar' }), K.iconButton({ icon: 'settings', label: 'Ajustes', small: true }),
    K.button({ icon: 'close', ariaLabel: 'Cerrar', variant: 'secondary', size: 'small' }));
  var tipBtn = K.iconButton({ icon: 'help', label: 'Ayuda' }); K.tooltip(tipBtn, 'Pasá el mouse o enfocá con Tab: así se ve un tooltip');
  demo(tipBtn, h('span', { 'class': 'soft small', text: '← Tooltip: hover o foco de teclado' }));

  /* ---- 04 chips y badges */
  sec('Chips y badges');
  demo(K.chip({ label: 'Motor', color: '#C4428E', selected: true }), K.chip({ label: 'Instrumentos', color: '#2196C4', selected: false }), K.chip({ label: 'Con ícono', icon: 'eye' }),
    K.badge('Esencial', 'accent'), K.badge('Hecho', 'ok', 'check'), K.badge('Cuidado', 'warn', 'warning'), K.badge('Error', 'bad'), K.badge('Dato', 'info', 'info'), K.badge('Nuevo', 'solid'), K.badge('Neutro'));

  /* ---- 05 segmentado y pestañas */
  sec('Segmentado y pestañas');
  demo(K.segmented({ label: 'Vista', value: 'cabina', items: [{ value: 'cabina', label: 'Cabina' }, { value: 'dos', label: 'Las dos' }, { value: 'afuera', label: 'Afuera' }], onChange: function () {} }));
  demo(h('div', { 'class': 'sg-wide' }, K.tabs({ label: 'Pestañas de línea', variant: 'line', value: 'a', items: [{ id: 'a', label: 'Resumen' }, { id: 'b', label: 'Cómo se usa' }, { id: 'c', label: 'Errores comunes' }] })));
  demo(h('div', { 'class': 'sg-wide', style: { 'max-width': '440px' } }, K.tabs({ label: 'Sub-pestañas', variant: 'pill', value: 'b', items: [{ id: 'a', label: 'Checklists' }, { id: 'b', label: 'Misiones y situaciones' }, { id: 'c', label: 'Quiz' }] })));

  /* ---- 06 tarjetas */
  sec('Tarjetas', 'plana · elevada · interactiva');
  var cards = h('div', { 'class': 'sg-grid', style: { 'grid-template-columns': 'repeat(auto-fill, minmax(260px, 1fr))' } });
  cards.appendChild(K.card({ variant: 'flat', title: 'Plana', sub: 'Fondo suave, sin borde.', children: h('p', { text: 'Sirve para agrupar contenido sin que pese.' }) }));
  cards.appendChild(K.card({ variant: 'raised', title: 'Elevada', sub: 'Con sombra.', children: h('p', { text: 'Para lo que querés destacar.' }) }));
  cards.appendChild(K.card({ variant: 'interactive', icon: 'cabin', title: 'Interactiva', sub: 'Toda la tarjeta es un botón.', onClick: function () { K.toast('¡Tocaste la tarjeta!', 'good'); } }));
  root.appendChild(cards);

  /* ---- 07 encabezados y avisos */
  sec('Encabezados de sección y avisos');
  demo(h('div', { 'class': 'sg-wide' }, K.sectionHeader(1, 'Mirá cómo vuela', '4 min'), K.sectionHeader(2, 'Probalo yo')));
  var co = h('div', { 'class': 'sg-wide' });
  co.appendChild(K.callout({ variant: 'tip', text: 'Agarrá el volante suave, como una taza de café: sin apretar.' }));
  co.appendChild(K.callout({ variant: 'dato', text: 'Los dos volantes del Cessna 150 están unidos: si movés uno, se mueve el otro.' }));
  co.appendChild(K.callout({ variant: 'cuidado', text: 'No muevas la mezcla a "pobre" a ciegas: el motor puede recalentarse.' }));
  co.appendChild(K.callout({ variant: 'error', title: 'Eso no estaba bien', text: 'Soltaste el freno de mano con el motor a fondo.' }));
  co.appendChild(K.callout({ variant: 'ok', text: '¡Perfecto! Terminaste la checklist antes de arrancar.' }));
  demo(co);

  /* ---- 08 progreso */
  sec('Progreso', 'barra · anillo · pasos');
  var pb = K.progressBar(0.45, { label: 'Avance' });
  var pbl = K.progressBar(0.8, { size: 'lg', ok: true, label: 'Casi listo' });
  demo(h('div', { 'class': 'sg-wide' }, pb, h('div', { style: { height: '12px' } }), pbl));
  demo(K.progressRing(0.35, { size: 96, label: 'camino' }), K.progressRing(1, { size: 72, ok: true, label: 'listo' }), K.progressRing(0.06, { size: 56, ariaLabel: 'Avance del quiz' }),
    h('div', { style: { flex: '1 1 260px' } }, K.progressSteps({ label: 'Tu camino', steps: [{ label: 'Conocé la cabina', state: 'done' }, { label: 'Cómo vuela', state: 'done' }, { label: 'Procedimientos', state: 'current' }, { label: 'Volá', state: 'todo' }, { label: 'Quiz', state: 'todo' }] })));

  /* ---- 09 datos */
  sec('Datos en vivo', 'stat · clave-valor');
  var ras = K.stat({ label: 'Velocidad (IAS)', value: '85', unit: 'kt' });
  demo(h('div', { 'class': 'stat-grid sg-wide' }, ras, K.stat({ label: 'Altura', value: '2 450', unit: 'ft' }), K.stat({ label: 'Motor', value: '2 300', unit: 'RPM' }), K.stat({ label: 'Rumbo', value: '090', unit: '°', small: true })));
  demo(h('div', { 'class': 'sg-wide' }, K.keyValue([['Dónde está', 'Frente a tu asiento'], ['Cuándo se usa', 'Todo el vuelo'], ['Rango verde', '47 – 107 kt'], ['Nunca exceder', '141 kt']])));
  var live = 85; setInterval(function () { live = 85 + Math.round(Math.sin(Date.now() / 700) * 6); ras.set(live); }, 400);

  /* ---- 10 acordeón */
  sec('Acordeón', '<details> animado');
  demo(h('div', { 'class': 'sg-wide' },
    K.accordion({ title: 'Qué hace', open: true, icon: 'info', content: h('p', { text: 'Mueve los alerones y el timón de profundidad con un solo mando. Tirar sube la nariz; girar inclina el avión.' }) }),
    K.accordion({ title: 'Errores comunes', content: h('p', { text: 'Apretar el volante con fuerza. Mirar el instrumento en vez de mirar afuera.' }) }),
    K.accordion({ title: 'Ver más', content: h('p', { text: 'Contenido que sólo aparece cuando lo pedís: así las pantallas no se llenan de texto.' }) })));

  /* ---- 11 popover, diálogo, hoja */
  sec('Popover, diálogo y hoja inferior');
  var popBtn = K.button({ label: 'Abrir popover', variant: 'secondary', onClick: function () {
    K.popover(popBtn, { title: 'IAS', content: [h('p', { text: 'Velocidad que marca el anemómetro, en nudos. Es la velocidad respecto del aire, no del suelo.' }), K.button({ label: 'Verlo en 3D', size: 'small', variant: 'primary', icon: 'eye' })] });
  } });
  var dlgBtn = K.button({ label: 'Abrir diálogo', variant: 'primary', onClick: function () {
    K.dialog({ kicker: 'Bienvenida', title: '¿Es tu primera vez?', body: [h('p', { text: 'Con esta cabina en 3D vas a aprender qué es cada mando antes de tu primera clase. Podés tocar todo: no se rompe nada.' }), K.callout({ variant: 'tip', text: 'En el celular esto se ve como una hoja que sube desde abajo.' })],
      actions: [{ label: 'Ya sé algo', variant: 'secondary' }, { label: 'Empezar', variant: 'primary', icon: 'play' }] });
  } });
  var toastBtn = K.button({ label: 'Mostrar aviso (toast)', onClick: function () { K.toast('Listo: checklist completa.', 'good'); } });
  demo(popBtn, dlgBtn, toastBtn);

  /* ---- 12 vacío, esqueleto, kbd */
  sec('Estados vacíos, esqueleto y teclas');
  demo(h('div', { 'class': 'sg-wide' }, K.emptyState({ icon: 'search', title: 'No encontré nada', text: 'Probá con otra palabra, por ejemplo "flaps" o "acelerador".', action: { label: 'Limpiar búsqueda', variant: 'secondary' } })));
  demo(h('div', { style: { flex: '1 1 320px' } }, K.skeleton('title'), K.skeleton('text', 3), h('div', { style: { height: '10px' } }), K.skeleton('block')),
    h('p', null, 'Atajos: ', K.kbd('Ctrl'), ' + ', K.kbd('K'), ' buscar · ', K.kbd('?'), ' ayuda · ', K.kbd('Esc'), ' cerrar'));

  /* ---- 13 sobre el 3D */
  sec('Vidrio sobre el 3D', 'cinematográfico');
  demo(h('div', { 'class': 'sg-stage' }, h('span', { 'class': 'glass' }, h('span', { text: 'IAS 085 kt' }), h('span', { text: 'ALT 2 450 ft' }), h('span', { text: 'RPM 2 300' }))));

  /* ---- AIRE · el lenguaje compartido (contrato v5): los mismos componentes que usa cada pestaña */
  sec('AIRE · el lenguaje compartido', 'panel de papel · HUD · dock · cadena');
  label('Cabecera, modos, secciones numeradas, tarjetas con código, deslizadores y barras (sobre papel cuadriculado)');
  var paper = h('div', { 'class': 'sg-paper paper' });
  paper.appendChild(K.pageHeader({ kicker: '04 · Aire · Laboratorio del aire', title: 'Cómo el aire hace volar al avión', sub: 'Mové los mandos y mirá en vivo cómo se mueve el aire, qué fuerzas aparecen y cómo reacciona el avión.',
    children: K.modes({ label: 'Modo', value: 'tunel', items: [{ value: 'tunel', label: 'Túnel de viento', sub: 'el avión quieto' }, { value: 'vuelo', label: 'En vuelo', sub: 'el avión reacciona' }] }) }));
  paper.appendChild(K.section({ num: 'EX', title: 'Experimentos', meta: '8 guiados', body: K.cardCarousel({ label: 'Experimentos', items: [
    { code: 'E1', title: 'Las cuatro fuerzas', sum: 'Sustentación, peso, empuje y resistencia: cuándo se equilibran y cuándo no.', meta: '4 pasos · en vuelo', current: true, tag: 'Empezá acá', onClick: function () {} },
    { code: 'E2', title: 'Los flaps', sum: 'Qué cambia en las fuerzas cuando bajás 10°, 20° o 40° de flaps.', meta: '5 pasos · túnel', onClick: function () {} },
    { code: 'E3', title: 'La pérdida', sum: 'Qué pasa con el aire cuando el ala se pone muy inclinada.', meta: '4 pasos · túnel', onClick: function () {} }] }) }));
  var rng = K.slider({ label: 'Velocidad del viento', min: 0, max: 140, step: 1, value: 80, big: true, format: function (v) { return Math.round(v) + ' nudos'; },
    zones: [{ from: 0, to: 47, color: '#D9A400' }, { from: 47, to: 100, color: '#2E9A4E' }, { from: 100, to: 140, color: '#C7362B' }],
    ticks: [{ v: 0, t: '0' }, { v: 47, t: '47' }, { v: 100, t: '100' }, { v: 140, t: '140', cls: 'is-red' }], quick: [{ v: 50, t: 'DESPEGUE' }, { v: 100, t: 'CRUCERO' }], sub: 'Verde: velocidades normales. Rojo: nunca excederla.' });
  var flp = K.slider({ label: 'Flaps', min: 0, max: 40, step: 1, value: 20, format: function (v) { return Math.round(v) + '°'; }, detents: [{ v: 0, t: '0°' }, { v: 10, t: '10°' }, { v: 20, t: '20°' }, { v: 30, t: '30°' }, { v: 40, t: '40°' }] });
  paper.appendChild(K.section({ num: 1, title: 'Mandos', meta: '2 deslizadores', body: h('div', { 'class': 'ctl-grp' }, rng, flp) }));
  var br = K.bars({ rows: [{ key: 'lift', label: 'Sustentación', color: 'var(--lab-lift)', caption: 'Arriba y abajo' }, { key: 'weight', label: 'Peso', color: 'var(--lab-weight)' }, { key: 'thrust', label: 'Empuje', color: 'var(--lab-thrust)', caption: 'Adelante y atrás' }, { key: 'drag', label: 'Resistencia', color: 'var(--lab-drag)' }] });
  paper.appendChild(K.section({ num: 2, title: 'Fuerzas', meta: 'en vivo', open: false, body: br }));
  paper.appendChild(K.section({ num: 3, title: 'Cómo se usa', open: false, body: h('p', { text: 'Esta sección empieza cerrada: tocá el título para abrirla.' }) }));
  var pap3 = K.modes({ label: 'Tres opciones', value: 'chk', items: [{ value: 'chk', label: 'Checklists', sub: '5 listas' }, { value: 'mis', label: 'Misiones y situaciones', sub: '8 + 6' }, { value: 'qz', label: 'Quiz', sub: '24 preguntas' }] });
  paper.appendChild(h('div', { style: { 'margin-top': '14px' } }, pap3));
  paper.appendChild(K.cardCarousel({ list: true, label: 'Lista de tarjetas', items: [{ code: 'L1', title: 'Cómo vuela un avión', sum: 'Las 4 fuerzas, paso a paso.', meta: '5 pasos · 9 min', onClick: function () {} }, { code: 'L2', title: 'Los 3 ejes', sum: 'Alabeo, cabeceo y guiñada.', meta: '5 pasos · 8 min', onClick: function () {} }] }));
  var sgPair = h('div', { 'class': 'sg-pair' }, paper);
  root.appendChild(sgPair);
  var fb = 0; setInterval(function () { fb += 0.05; br.set('lift', 0.5 + 0.1 * Math.sin(fb), Math.round(500 + 60 * Math.sin(fb)) + ' kg'); br.set('weight', 0.5, '500 kg'); br.set('thrust', 0.4 + 0.1 * Math.cos(fb), '31 kg'); br.set('drag', 0.4 + 0.1 * Math.cos(fb), '31 kg'); }, 200);

  /* ---- sobre el 3D */
  function stage3d(phone) {
    var wrap = h('div', { 'class': 'sg-3d' + (phone ? ' sg-3d--phone' : '') });
    var stage = h('div', { 'class': 'vp-stage' });
    var hd = K.hud({ label: 'Estado del avión', kicker: 'Cabina · Estacionado', bigs: [{ label: 'Motor', unit: 'rpm' }, { label: 'Velocidad', unit: 'nudos' }, { label: 'Altura', unit: 'pies' }] });
    var t0 = 0;
    function tick() {
      t0 += 0.08;
      hd.set({ kicker: 'Lecciones · En vuelo', live: true, bigs: [{ v: 2300 + Math.round(Math.sin(t0) * 40), u: 'rpm', l: 'Motor' }, { v: 95 + Math.round(Math.sin(t0 * 1.3) * 3), u: 'nudos', l: 'Velocidad' }, { v: 3000 + Math.round(Math.sin(t0 * 0.7) * 30), u: 'pies', l: 'Altura' }],
        row: [{ text: 'Corriente encendida', onClick: function () {} }, { text: 'Flaps 0°' }, { text: 'En vuelo', onClick: function () {} }],
        pill: { text: 'En vuelo', tone: 'is-air' },
        extra: { k: 'Lección 2 · paso 3 de 5', t: '', nums: [{ v: Math.abs(Math.round(Math.sin(t0) * 20)), u: '° der.', l: 'Alabeo' }, { v: 3, u: '° arriba', l: 'Cabeceo' }] } });
    }
    tick(); setInterval(tick, 200);
    stage.appendChild(hd);
    var bottom = h('div', { 'class': 'vp-bottom' });
    var bar = K.chainBar();
    bar.set(['Acelerador', 'Empujás para dar más potencia', 'La hélice gira más rápido'], { key: 'demo' });
    var vista = K.dockGroup({ label: 'Vista', value: 'pilot', items: ['Piloto', 'Horizonte', 'Tablero', 'Izquierda', 'Centro', 'Derecha', 'Piso', 'Techo'].map(function (t, i) { return { value: ['pilot', 'flight', 'panel', 'left', 'center', 'right', 'floor', 'overhead'][i], label: t }; }) });
    vista.classList.add('dock-group--vista');
    var vchip = h('div', { 'class': 'dock-group dock-group--view' }, h('span', { 'class': 'dock-label', text: 'Vista' }), h('button', { type: 'button', 'class': 'seg-btn scn-btn view-btn' }, h('span', { 'class': 'scn-btn-v', text: 'Piloto' }), K.icon('chevron-down')));
