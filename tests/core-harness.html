<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Harness</title>
<!--
  tests/core-harness.html — standalone test page for src/core.js (C150.Core).
  Serve the project root (e.g. `python -m http.server 8705`) and open /tests/core-harness.html.
  Uses the REAL modules from src/; small inline stubs are installed only for modules that failed to load.
  "Correr pruebas" (or ?autotest=1) runs scripted checks with synthetic pointer/keyboard events:
  picking, select + fly-to, operate, drags (throttle, yoke, trim, pedals, toe brakes), control lock, keyboard,
  swap/inset, holds, momentary switches, pickMode, exterior enlarge, dot-path inputs, resize and frame rate.
  Results: on the page, in the console and in window.__coreTestResults.
-->
<style>
  :root { --bg:#0D1318; --surface:#151D24; --line:#2C3944; --fg:#E4EAEE; --soft:#9AA9B5; --accent:#F08A3C; --good:#2E9A4E; --bad:#C7362B; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  #view { position: relative; flex: 1; min-width: 0; height: 100%; }
  #side { width: 380px; height: 100%; overflow: auto; padding: 10px 12px; box-sizing: border-box; border-left: 1px solid var(--line); background: var(--surface); }
  h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: .04em; text-transform: uppercase; }
  h2 { font-size: 12px; margin: 12px 0 4px; color: var(--soft); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  button, select { font: inherit; color: var(--fg); background: #1D2730; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible { outline: 2px solid #6FA8DC; outline-offset: 1px; }
  #status { font-family: ui-monospace, monospace; font-size: 11px; color: var(--soft); white-space: pre-wrap; margin-top: 6px; }
  #log { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; max-height: 28vh; overflow: auto; border-top: 1px solid var(--line); padding-top: 4px; }
  #tests { font-family: ui-monospace, monospace; font-size: 11px; }
  #tests .pass { color: #6fd28a; } #tests .fail { color: #ff7a6e; } #tests .sum { font-weight: bold; margin-top: 4px; }
  #insetLabel { position: absolute; pointer-events: none; font: 600 11px/1 'Arial Narrow', sans-serif; letter-spacing: .05em; text-transform: uppercase;
    background: rgba(13,19,24,.72); color: #E4EAEE; padding: 3px 6px; border-radius: 0 0 4px 0; display: none; z-index: 2; }
  #tip { position: absolute; pointer-events: none; background: rgba(13,19,24,.85); color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 12px; z-index: 3; display: none; }
  #err { position: absolute; inset: 20px; display: none; align-items: center; justify-content: center; text-align: center; color: #ffb4ab; z-index: 4; }
  @media (max-width: 760px) { body { flex-direction: column; } #view { height: 56%; flex: none; } #side { width: auto; height: 44%; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="view"><div id="insetLabel"></div><div id="tip"></div><div id="err"></div></div>
<div id="side">
  <h1>C150.Core — banco de pruebas</h1>
  <div class="row">
    <button id="runTests">Correr pruebas</button>
    <button id="swap">Cambiar vista (C)</button>
    <button id="pause">Pausa (P)</button>
    <button id="insetToggle">Inset on/off</button>
    <button id="narrow">Ancho 600 px</button>
  </div>
  <h2>Cámara</h2>
  <div class="row" id="presets"></div>
  <h2>Simulación y exterior</h2>
  <div class="row">
    <select id="simPreset" aria-label="Preset de simulación"></select>
    <select id="anim" aria-label="Animación exterior"><option value="">(animación)</option></select>
    <button id="enlarge">Agrandar</button>
    <button id="stopAnim">Parar</button>
  </div>
  <div class="row" style="margin-top:4px">
    <select id="target" aria-label="Resaltar objetivo"><option value="">(objetivo)</option></select>
    <button id="pickBtn">Modo "¿dónde está?"</button>
    <button id="holdStart">Mantener START</button>
    <button id="holdFlaps">Mantener flaps DOWN</button>
  </div>
  <div id="status"></div>
  <h2>Pruebas</h2>
  <div id="tests">—</div>
  <h2>Eventos</h2>
  <div id="log"></div>
</div>

(function () {

  var C150 = window.C150 = window.C150 || {};
  var stubbed = [];
  if (!C150.Sim) {
    stubbed.push('Sim');
    C150.Sim = {
      createState: function () {
        return { yokeRoll: 0, yokePitch: 0, rudder: 0, brakeL: 0, brakeR: 0, parkingBrake: true, controlLock: true, throttle: 0, mixture: 1,
          carbHeat: 0, primerOut: 0, primerLocked: true, ignition: 'OFF', masterBat: false, masterAlt: false, flapSwitch: 'OFF', trim: 0,
          fuelValve: true, cabinHeat: 0, cabinAir: 0, lights: { dome: false, nav: false, strobe: false, beacon: false, taxi: false, landing: false },
          pitotHeat: false, panelLights: 0, radio: { comOn: false, obs: 0, xpdrMode: 'OFF' }, altimeterSetting: 29.92, hiCorrection: 0,
          doorLeftOpen: false, doorRightOpen: false, windowLeftOpen: false, paused: false, engine: { running: false, rpm: 0, primeCharges: 0 },

      },

      ground.rotation.x = -Math.PI / 2; ground.position.y = -0.65; g.add(ground);

  }
  if (!C150.Cockpit) {
    stubbed.push('Cockpit');
    C150.Cockpit = { create: function (THREE) {
      var g = new THREE.Group(), pickables = [], anchors = {}, views = {}, mats = {};
      function box(id, x, y, z, w, h, d, color) {
        var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color }));
        m.position.set(x, y, z); m.userData.controlId = id; g.add(m); pickables.push(m); anchors[id] = m; mats[id] = m.material;
        views[id] = { position: new THREE.Vector3(x + 0.05, y + 0.12, z + 0.42), target: new THREE.Vector3(x, y, z) };
      }
      var panel = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.42, 0.02), new THREE.MeshStandardMaterial({ color: 0x333333 }));
      panel.position.set(0, 0.48, -0.011); g.add(panel);
      box('yoke', -0.266, 0.476, 0.16, 0.2, 0.06, 0.03, 0x222222);
      box('throttle', 0.009, 0.312, 0.03, 0.03, 0.03, 0.06, 0x111111);
      box('master', -0.355, 0.312, 0.01, 0.03, 0.05, 0.02, 0xaa2222);
      var V = THREE.Vector3;
      return { group: g, pickables: pickables, anchors: anchors, views: views,
        presets: { pilot: { position: new V(-0.235, 0.88, 0.70), target: new V(-0.10, 0.50, 0), label: 'Piloto' },
          center: { position: new V(0.03, 0.55, 0.40), target: new V(0.03, 0.45, 0), label: 'Centro' } },
        dragAxes: { throttle: { axis: new V(0, 0, -1), length: 0.06, out: new V(0, 0, 1) } },
        update: function () {}, setHighlight: function (id, kind) { if (mats[id]) mats[id].emissive.setHex(kind ? 0x553311 : 0); },
        clearHighlights: function () {}, eye: new V(-0.235, 0.88, 0.70) };
    } };
  }
  if (!C150.Exterior) {
    stubbed.push('Exterior');
    C150.Exterior = { create: function (THREE) {
      var scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfd6ea);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1));
      var body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 6), new THREE.MeshStandardMaterial({ color: 0xffffff })); scene.add(body);
      var camera = new THREE.PerspectiveCamera(35, 4 / 3, 0.1, 500); camera.position.set(-6.6, 3.5, 9); var target = new THREE.Vector3();
      camera.lookAt(target);
      var ext = { scene: scene, camera: camera, root: body, target: target, cameraBusy: false, followAttitude: true, playing: null, caption: '',
        update: function () {}, setHighlight: function () {}, play: function (n) { ext.playing = n; return true; }, stop: function () { ext.playing = null; },
        setView: function () {}, showLabels: function () {}, setSize: function (w, h) { camera.aspect = w / h; camera.updateProjectionMatrix(); } };
      return ext;
    } };
  }
  window.__stubbed = stubbed;
})();

<script src="../src/core.js"></script>
<script>
(function () {
  'use strict';
  var C150 = window.C150, Core = C150.Core;
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), logEl = $('log'), statusEl = $('status'), tip = $('tip'), insetLabel = $('insetLabel');
  var params = new URLSearchParams(location.search);

  // Synthetic pointer ids are not "active" pointers: make pointer capture tolerant (test-only shim).
  ['setPointerCapture', 'releasePointerCapture'].forEach(function (fn) {
    var orig = HTMLCanvasElement.prototype[fn];
    HTMLCanvasElement.prototype[fn] = function (id) { try { return orig.call(this, id); } catch (e) { return undefined; } };
  });

  /* ------------------------------------------------------------ event log */
  var events = [], frameCount = 0;
  function log(line) {
    var d = document.createElement('div'); d.textContent = line;
    logEl.insertBefore(d, logEl.firstChild);
    while (logEl.childNodes.length > 120) logEl.removeChild(logEl.lastChild);
  }
  function nameOf(id) {
    var list = (C150.DATA && C150.DATA.controls) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].nombre;
    return id;
  }
  ['hover', 'select', 'operate', 'viewchange', 'pick', 'layout', 'error', 'preset', 'pause', 'animend', 'interactionend', 'mirror'].forEach(function (ev) {
    Core.on(ev, function (a, b, c) {
      events.push({ ev: ev, a: a, b: b, c: c, t: performance.now() });
      if (ev !== 'hover' || a) log(ev + ' ' + JSON.stringify([a, b].filter(function (x) { return x !== undefined; })));
    });
  });
  Core.on('frame', function () { frameCount++; });
  Core.on('error', function (msg) { var e = $('err'); e.textContent = msg; e.style.display = 'flex'; });
  Core.on('hover', function (id, sub, p) {
    if (!id) { tip.style.display = 'none'; return; }
    tip.textContent = nameOf(id) + (sub ? ' · ' + sub : '');
    tip.style.left = (p.x + 14) + 'px'; tip.style.top = (p.y + 10) + 'px'; tip.style.display = 'block';
  });
  Core.on('layout', function (r) {
    if (r && r.mode === 'dos' && r.rects && r.rects.exterior) {   // contract v3: two equal views
      var xr = r.rects.exterior;
      insetLabel.style.display = 'block'; insetLabel.style.left = xr.x + 'px'; insetLabel.style.top = xr.y + 'px';
      insetLabel.textContent = Core.isMirroring && Core.isMirroring() ? 'Afuera · la cabina muestra cómo se ve desde adentro' : 'Afuera';
      return;
    }
    if (!r || !(r.w > 0)) { insetLabel.style.display = 'none'; return; }
    insetLabel.style.display = 'block';
    insetLabel.style.left = r.x + 'px'; insetLabel.style.top = r.y + 'px';
    insetLabel.textContent = r.main === 'cockpit' ? 'Exterior · clic para agrandar' : 'Cabina · clic para volver';
  });

  var ok = Core.init({ container: view, state: C150.Sim.createState('parked') });
  var state = Core.state;
  window.__core = Core;

  // Some embedded/hidden browser panes pause requestAnimationFrame: core.js now drives itself from a ~30 Hz timer
  // meanwhile (its own watchdog), so the harness no longer pumps Core.tick() itself.
  if (window.__stubbed.length) log('STUBS: ' + window.__stubbed.join(', '));

  /* ------------------------------------------------------------ debug UI */
  ['pilot', 'flight', 'panel', 'left', 'center', 'right', 'floor', 'overhead', 'copilot', 'door'].forEach(function (n, i) {
    var b = document.createElement('button'); b.textContent = (i < 8 ? (i + 1) + ' ' : '') + n;
    b.addEventListener('click', function () { Core.focusPreset(n); }); $('presets').appendChild(b);
  });
  Object.keys(C150.Sim.PRESETS || { parked: 1 }).forEach(function (k) {
    var o = document.createElement('option'); o.value = k; o.textContent = 'Sim: ' + k; $('simPreset').appendChild(o);
  });
  $('simPreset').addEventListener('change', function (e) { Core.applyPreset(e.target.value); });
  ((Core.exterior && Core.exterior.ANIMATIONS) || []).forEach(function (a) {
    var o = document.createElement('option'); o.value = a; o.textContent = a; $('anim').appendChild(o);
  });
  $('anim').addEventListener('change', function (e) { if (e.target.value) Core.playExterior(e.target.value, { loop: true }); });
  $('enlarge').addEventListener('click', function () { var a = $('anim').value || 'axes-roll'; Core.playExterior(a, { enlarge: true }); });
  $('stopAnim').addEventListener('click', function () { Core.playExterior(null); });
  ((C150.DATA && C150.DATA.controls) || []).forEach(function (c) {
    var o = document.createElement('option'); o.value = c.id; o.textContent = c.id; $('target').appendChild(o);
  });
  $('target').addEventListener('change', function (e) { Core.setTargetHighlight(e.target.value || null); });
  $('swap').addEventListener('click', function () { Core.setMainView(Core.getMainView() === 'cockpit' ? 'exterior' : 'cockpit'); });
  $('pause').addEventListener('click', function () { Core.setPaused(!state.paused); });
  var insetOn = true;
  $('insetToggle').addEventListener('click', function () { insetOn = !insetOn; Core.setInsetVisible(insetOn); });
  $('narrow').addEventListener('click', function () { view.style.flex = view.style.flex ? '' : '0 0 600px'; });
  $('pickBtn').addEventListener('click', function () { Core.pickMode(function (id) { log('pickMode → ' + id); }); log('pickMode armado: hacé clic en un control'); });
  function holdButton(btn, id, sub) {
    var b = $(btn);
    b.addEventListener('pointerdown', function () { Core.hold(id, sub, true); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) { b.addEventListener(t, function () { Core.hold(id, sub, false); }); });
  }
  holdButton('holdStart', 'ignition', 'start');
  holdButton('holdFlaps', 'flap-switch', 'down');
  setInterval(function () {
    var s = state;
    statusEl.textContent = 'vista ' + Core.getMainView() + (s.paused ? ' (PAUSA)' : '') + ' · sel ' + (Core.getSelected() || '—') +
      '\nyoke ' + s.yokeRoll.toFixed(2) + '/' + s.yokePitch.toFixed(2) + ' timón ' + s.rudder.toFixed(2) + ' frenos ' + s.brakeL.toFixed(1) + '/' + s.brakeR.toFixed(1) +
      '\nacel ' + s.throttle.toFixed(2) + ' mezcla ' + s.mixture.toFixed(2) + ' carb ' + s.carbHeat.toFixed(2) + ' trim ' + s.trim.toFixed(2) +
      '\nllave ' + s.ignition + ' flaps ' + s.flapSwitch + ' ' + (s.flaps || 0).toFixed(1) + '° · bat ' + s.masterBat + ' alt ' + s.masterAlt +
      ' · traba ' + s.controlLock + '\nRPM ' + Math.round((s.engine && s.engine.rpm) || 0) + ' · ' + (Core.getCaption() || '');
    if (s.events && s.events.length) { s.events.splice(0).forEach(function (e) { log('state.event [' + e.kind + '] ' + e.text); }); }
  }, 250);

  /* ------------------------------------------------------------ test helpers */
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function assert(c, msg) { if (!c) throw new Error(msg); }
  function near(a, b, tol) { return Math.abs(a - b) <= tol; }
  function lastEvent(ev) { for (var i = events.length - 1; i >= 0; i--) if (events[i].ev === ev) return events[i]; return null; }
  function eventsSince(ev, t0) { return events.filter(function (e) { return e.ev === ev && e.t >= t0; }); }
  var canvas = Core.renderer && Core.renderer.domElement;
  var pid = 10;
  function fire(type, x, y, opt) {
    opt = opt || {};
    var r = canvas.getBoundingClientRect();
    canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, pointerId: opt.id || 1, pointerType: opt.type || 'mouse',
      button: type === 'pointermove' ? -1 : (opt.button || 0), buttons: type === 'pointerup' ? 0 : 1, isPrimary: true, bubbles: true, cancelable: true }));
  }
  async function click(p) { var id = ++pid; fire('pointerdown', p.x, p.y, { id: id }); await wait(40); fire('pointerup', p.x, p.y, { id: id }); await wait(60); }
  async function drag(p, dx, dy, opt) {
    var id = ++pid, steps = 6;
    fire('pointerdown', p.x, p.y, { id: id });
    fire('pointermove', p.x + Math.sign(dx || 0) * 8, p.y + Math.sign(dy || 0) * 8, { id: id });   // passes the 6 px threshold
    var sx = p.x + Math.sign(dx || 0) * 8, sy = p.y + Math.sign(dy || 0) * 8;
    for (var i = 1; i <= steps; i++) { fire('pointermove', sx + dx * i / steps, sy + dy * i / steps, { id: id }); await wait(16); }
    if (opt && opt.during) await opt.during();
    fire('pointerup', sx + dx, sy + dy, { id: id });
    await wait(30);
  }
  function key(type, k) { document.body.dispatchEvent(new KeyboardEvent(type, { key: k, bubbles: true, cancelable: true })); }
  async function tap(k, ms) { key('keydown', k); await wait(ms || 30); key('keyup', k); }
  /** A screen point (css px) where Core.pickAt returns this control id, or null. */
  function findPoint(id) {
    var cam = Core.camera, r = Core.getInsetRect(), W = canvas.clientWidth, H = canvas.clientHeight;
    var v = new THREE.Vector3(), best = null;
    var meshes = (Core.cockpit.pickables || []).filter(function (m) { return m.userData.controlId === id && m.layers.test(new THREE.Layers()); });
    for (var m = 0; m < meshes.length && !best; m++) {
      var mesh = meshes[m], pos = mesh.geometry.attributes.position, n = pos.count, step = Math.max(1, Math.floor(n / 60));
      mesh.geometry.computeBoundingBox();
      var pts = [mesh.geometry.boundingBox.getCenter(new THREE.Vector3())];
      for (var i = 0; i < n; i += step) pts.push(new THREE.Vector3().fromBufferAttribute(pos, i).multiplyScalar(0.85).add(pts[0].clone().multiplyScalar(0.15)));
      for (var j = 0; j < pts.length; j++) {
        v.copy(pts[j]).applyMatrix4(mesh.matrixWorld).project(cam);
        var x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
        if (x < 4 || y < 4 || x > W - 4 || y > H - 4 || v.z > 1) continue;
        if (r && x >= r.x - 4 && x <= r.x + r.w + 4 && y >= r.y - 4 && y <= r.y + r.h + 4) continue;
        var hit = Core.pickAt(x, y);
        if (hit && hit.id === id) { best = { x: x, y: y, sub: hit.subId }; break; }
      }
    }
    return best;
  }
  async function viewFor(id, presets) {
    var p = findPoint(id);
    for (var i = 0; !p && i < presets.length; i++) { Core.focusPreset(presets[i]); await wait(1000); p = findPoint(id); }
    return p;
  }
  function screenDir(id) {   // projected value-increasing axis of a knob (independent of core's math)
    var ax = Core.cockpit.dragAxes[id], a = Core.cockpit.anchors[id].getWorldPosition(new THREE.Vector3());
    var b = a.clone().addScaledVector(ax.axis, ax.length);
    a.project(Core.camera); b.project(Core.camera);
    var dx = (b.x - a.x) * canvas.clientWidth / 2, dy = -(b.y - a.y) * canvas.clientHeight / 2, L = Math.hypot(dx, dy) || 1;
    return L < 20 ? { x: 0, y: ax.axis.z < 0 ? -1 : 1 } : { x: dx / L, y: dy / L };
  }
  function expectedInset() {
    var W = canvas.clientWidth, H = canvas.clientHeight, w = Core.isMobile() ? Math.min(360, Math.max(120, W * 0.42)) : Math.min(360, Math.max(170, W * 0.30));
    var h = w * 0.75; if (h > H * 0.45) { h = H * 0.45; w = h * 4 / 3; }
    return { x: W - 12 - Math.round(w), y: 12, w: Math.round(w), h: Math.round(h) };
  }

  /* ------------------------------------------------------------ tests */
  var TESTS = [
    ['init: canvas, vista cabina, layout del inset', async function () {
      assert(ok === true, 'init devolvió ' + ok);
      assert(canvas && canvas.parentNode === view, 'canvas no está en el contenedor');
      assert(Core.getMainView() === 'cockpit', 'vista inicial ' + Core.getMainView());
      var r = Core.getInsetRect(), e = expectedInset();
      assert(r && r.x === e.x && r.y === e.y && r.w === e.w && r.h === e.h, 'inset ' + JSON.stringify(r) + ' esperado ' + JSON.stringify(e));
      assert(lastEvent('layout'), 'no hubo evento layout');
    }],
    ['frame ~15 Hz', async function () {
      var c0 = frameCount; await wait(1000); var n = frameCount - c0;
      assert(n >= 8 && n <= 20, n + ' eventos frame en 1 s');
    }],
    ['hover sobre el acelerador', async function () {
      Core.applyPreset('parked');
      var p = await viewFor('throttle', ['center', 'pilot', 'panel']);
      assert(p, 'no encontré el acelerador en pantalla');
      fire('pointermove', p.x, p.y); await wait(120);
      var h = lastEvent('hover'); assert(h && h.a === 'throttle', 'hover ' + (h && h.a));
      assert(canvas.style.cursor === 'grab', 'cursor ' + canvas.style.cursor);
    }],
    ['clic: select + fly-to a la vista del control', async function () {
      Core.select(null);
      var p = findPoint('throttle'); await click(p);
      assert(Core.getSelected() === 'throttle', 'seleccionado ' + Core.getSelected());

  async function mirrorTest() {
    {
      Core.setLayout('dos');
      Core.applyPreset('parked'); await wait(200);
      var t0 = performance.now(), field = state.fieldElevation;
      var cap = Core.poseExterior('alabeo-der');

      await wait(2500);
      var A = Core.getAnimState();
      assert(A && A.active, 'animState.active');
      assert(Core.isMirroring() && state.puppet.on, 'no está espejando');
      assert(eventsSince('mirror', t0).some(function (e) { return e.a === true; }), 'evento mirror(true)');
      assert(Math.abs(state.air.bank - A.bank) < 3 && state.air.bank > 8, 'alabeo cabina ' + state.air.bank.toFixed(1) + ' vs exterior ' + A.bank.toFixed(1));
      assert(!state.controlLock && state.engine.running && state.air.altitude > field + 1000, 'cabina viva en vuelo');
      assert(state.air.ias > 50 && Math.abs(state.air.turnRate - A.turnRate) < 1.5, 'ias/turn ' + state.air.ias.toFixed(0) + ' ' + state.air.turnRate.toFixed(1));
      assert(state.gyro.aiSpin > 0.9 && state.gyro.tcPowered, 'giróscopos y coordinador');
      Core.poseExterior('flaps-20'); await wait(4000);
      A = Core.getAnimState();
      assert(Math.abs(state.flaps - A.flaps) < 0.5 && state.flaps > 5, 'flaps cabina ' + state.flaps.toFixed(1) + ' vs ' + A.flaps.toFixed(1));
      Core.setPaused(true);
      Core.poseExterior('alabeo-izq'); await wait(5500);          // from +25° to −25°: a calm, realistic roll
      A = Core.getAnimState();
      assert(state.air.bank < -8 && Math.abs(state.air.bank - A.bank) < 3, 'con pausa el espejo sigue: ' + state.air.bank.toFixed(1));
      Core.setPaused(false);
      Core.clearPose(); await wait(1200);
      assert(!Core.isMirroring() && !state.puppet.on, 'sigue espejando tras clearPose');
      assert(eventsSince('mirror', t0).some(function (e) { return e.a === false; }), 'evento mirror(false)');
      assert(state.air.onGround && state.air.altitude === field && state.controlLock && !state.engine.running && state.flaps === 0,
        'no se restauró el estado (alt ' + state.air.altitude + ', traba ' + state.controlLock + ')');
    }

      assert(eventsSince('layout', t0).length > 0, 'sin evento layout');
      assert(r.w === e.w && r.x === e.x, 'inset ' + JSON.stringify(r) + ' esperado ' + JSON.stringify(e));
      view.style.flex = ''; await wait(600);
      e = expectedInset(); r = Core.getInsetRect();
      assert(r.w === e.w, 'inset tras restaurar ' + r.w + ' vs ' + e.w);
    }]
  );

  async function runTests() {
    var out = $('tests'); out.textContent = '';
    var results = [], pass = 0;
    for (var i = 0; i < TESTS.length; i++) {
      var name = TESTS[i][0], row = document.createElement('div');
      try { await TESTS[i][1](); results.push({ name: name, ok: true }); pass++; row.className = 'pass'; row.textContent = 'PASS ' + name; }
      catch (e) { results.push({ name: name, ok: false, error: e.message }); row.className = 'fail'; row.textContent = 'FAIL ' + name + ' — ' + e.message; console.error('[core-harness] FAIL ' + name, e); }
      out.appendChild(row);
      key('keyup', 'ArrowLeft'); key('keyup', 'ArrowRight'); key('keyup', 'ArrowUp'); key('keyup', 'ArrowDown');
    }
    var sum = document.createElement('div'); sum.className = 'sum'; sum.textContent = pass + ' / ' + TESTS.length + ' OK';
    out.appendChild(sum);
    console.log('[core-harness] ' + pass + '/' + TESTS.length + ' OK', results.filter(function (r) { return !r.ok; }));
    window.__coreTestResults = { pass: pass, total: TESTS.length, results: results };
    Core.applyPreset('parked'); Core.focusPreset('pilot'); Core.select(null);
    return window.__coreTestResults;
  }
  window.__runCoreTests = runTests;
  $('runTests').addEventListener('click', runTests);
  if (params.get('autotest') === '1' && ok) setTimeout(runTests, 1500);
})();
